<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codex AI Agent 電腦工作助理實戰</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --fg: #111111;
      --muted: #676767;
      --border: #e5e5e5;
      --accent: #2f6feb;
      --accent-soft: color-mix(in oklab, var(--accent), transparent 88%);
      --warn: #b45309;
      --warn-soft: #fff7ed;
      --danger: #dc2626;
      --success: #16803a;
      --font-display: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.5;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { text-wrap: balance; letter-spacing: 0; }
    p, li { text-wrap: pretty; }

    #deck { position: fixed; inset: 0; }
    .slide {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      padding: clamp(38px, 5.4vw, 78px) clamp(46px, 6.8vw, 104px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      opacity: 0;
      pointer-events: none;
      transform: translateX(100%);
      transition: transform 260ms var(--ease-standard), opacity 180ms var(--ease-standard);
    }
    .slide.is-active { opacity: 1; pointer-events: auto; transform: translateX(0); z-index: 1; }
    .slide.is-before { transform: translateX(-100%); }
    .slide.dark { background: var(--fg); color: var(--bg); }
    .slide.dark .lead, .slide.dark .muted, .slide.dark li { color: color-mix(in oklab, var(--bg), transparent 20%); }
    .slide.dark .plain-card, .slide.dark .step-box, .slide.dark .teacher-panel { background: color-mix(in oklab, var(--bg), transparent 92%); border-color: color-mix(in oklab, var(--bg), transparent 82%); }
    .slide.dark .plain-card h3, .slide.dark .step-box h3, .slide.dark .teacher-panel h3 { color: var(--bg); }
    .slide.dark .safety-strip { background: color-mix(in oklab, var(--bg), transparent 90%); color: var(--bg); border-color: color-mix(in oklab, var(--bg), transparent 74%); }

    .center { align-items: center; text-align: center; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .h-hero { font-size: clamp(54px, 7.8vw, 112px); line-height: 1.04; margin: 0 0 20px; font-weight: 760; max-width: 12ch; }
    .h-xl { font-size: clamp(42px, 5.2vw, 70px); line-height: 1.12; margin: 0 0 20px; font-weight: 740; max-width: 18ch; }
    .h-md { font-size: clamp(34px, 4vw, 52px); line-height: 1.16; margin: 0 0 20px; font-weight: 720; max-width: 20ch; }
    .lead { font-size: clamp(21px, 2.1vw, 30px); color: var(--muted); line-height: 1.55; max-width: 58ch; }
    .center .lead { margin-inline: auto; }

    .hero-flow { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 16px; width: min(880px, 100%); margin-top: 42px; }
    .plain-card, .step-box, .teacher-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 22px;
    }
    .plain-card h3, .step-box h3, .teacher-panel h3 { font-size: 28px; line-height: 1.2; margin-bottom: 10px; }
    .plain-card p, .step-box p, .teacher-panel p { color: var(--muted); margin: 0; font-size: 19px; }

    .three-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin-top: 34px; }
    .two-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 34px; margin-top: 34px; }
    .four-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-top: 32px; }
    .flow-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; margin-top: 34px; }
    .flow-list .step-box { min-height: 170px; }
    .num { font-family: var(--font-mono); color: var(--accent); font-size: 14px; margin-bottom: 14px; display: block; }

    .screen-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.28fr) minmax(340px, 0.72fr);
      gap: 36px;
      align-items: center;
      min-height: 0;
    }
    .screen-layout.compact { grid-template-columns: minmax(0, 1fr) minmax(340px, 0.86fr); }
    .screenshot-frame {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      height: min(72vh, 620px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px color-mix(in oklab, var(--fg), transparent 93%);
      margin: 0;
    }
    .screenshot-frame img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .teacher-panel { padding: 24px; }
    .teacher-panel h2 { font-size: clamp(30px, 3.4vw, 46px); line-height: 1.15; margin-bottom: 18px; }
    .teach-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 13px; }
    .teach-list li {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      color: var(--muted);
      font-size: 18px;
    }
    .teach-list strong { color: var(--fg); display: block; margin-bottom: 4px; }
    .slide.dark .teach-list strong { color: var(--bg); }
    .teach-list .warn strong { color: var(--warn); }
    .safety-strip {
      margin-top: 18px;
      border: 1px solid color-mix(in oklab, var(--warn), transparent 72%);
      background: var(--warn-soft);
      color: #7c2d12;
      border-radius: 8px;
      padding: 14px 16px;
      font-weight: 700;
    }

    .check-list { display: grid; gap: 14px; margin-top: 28px; max-width: 1000px; }
    .check-list li { list-style: none; border-top: 1px solid var(--border); padding-top: 13px; font-size: clamp(21px, 2.1vw, 29px); }
    .check-list strong { color: var(--accent); margin-right: 10px; font-family: var(--font-mono); font-size: 16px; }
    .quote { font-size: clamp(38px, 5vw, 70px); line-height: 1.16; max-width: 15ch; font-weight: 760; }
    .template-box {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 32px;
      align-items: start;
      margin-top: 28px;
    }
    .template-code {
      font-family: var(--font-mono);
      white-space: pre-wrap;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      font-size: 16px;
      line-height: 1.55;
      max-height: 64vh;
      overflow: hidden;
    }
    .slide.dark .template-code { background: color-mix(in oklab, var(--bg), transparent 92%); border-color: color-mix(in oklab, var(--bg), transparent 82%); color: var(--bg); }
    .notes { display: none; }

    .deck-counter {
      position: fixed;
      right: 30px;
      bottom: 24px;
      z-index: 10;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--fg);
    }
    .deck-hint {
      position: fixed;
      left: 30px;
      bottom: 25px;
      z-index: 10;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .deck-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      width: 0;
      background: var(--accent);
      z-index: 10;
      transition: width 200ms var(--ease-standard);
    }

    @media (max-width: 900px) {
      .slide { padding: 32px 26px 62px; }
      .screen-layout, .screen-layout.compact { grid-template-columns: minmax(0, 1fr) minmax(230px, 0.86fr); gap: 16px; }
      .template-box { grid-template-columns: 1fr; gap: 18px; }
      .screenshot-frame { height: 58vh; }
      .three-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .two-grid, .four-grid, .flow-list, .hero-flow { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .plain-card, .step-box, .teacher-panel { padding: 16px; }
      .plain-card h3, .step-box h3, .teacher-panel h3 { font-size: 22px; }
      .plain-card p, .step-box p, .teacher-panel p, .teach-list li { font-size: 16px; }
      .lead { font-size: 20px; }
      .h-hero { font-size: 52px; }
      .h-xl { font-size: 40px; }
      .h-md { font-size: 32px; }
    }
    @media (max-width: 620px), (max-height: 680px) {
      .slide { padding: 24px 26px 56px; }
      .eyebrow { margin-bottom: 10px; font-size: 11px; }
      .lead { font-size: 18px; line-height: 1.42; }
      .h-hero { font-size: 44px; line-height: 1.04; }
      .h-xl { font-size: 34px; line-height: 1.1; margin-bottom: 12px; }
      .h-md { font-size: 28px; line-height: 1.12; margin-bottom: 12px; }
      .three-grid, .two-grid, .four-grid, .flow-list, .hero-flow { gap: 10px; margin-top: 16px; }
      .plain-card, .step-box, .teacher-panel { padding: 13px; }
      .plain-card h3, .step-box h3, .teacher-panel h3 { font-size: 20px; margin-bottom: 6px; }
      .plain-card p, .step-box p, .teacher-panel p, .teach-list li { font-size: 14px; line-height: 1.38; }
      .check-list { gap: 8px; margin-top: 14px; }
      .check-list li { font-size: 18px; padding-top: 8px; }
      .template-code { font-size: 13px; line-height: 1.38; padding: 14px; max-height: 52vh; }
      .screen-layout, .screen-layout.compact { grid-template-columns: minmax(0, 1fr) minmax(220px, 0.9fr); gap: 12px; }
      .screenshot-frame { height: 62vh; padding: 8px; }
      .teach-list { gap: 8px; }
      .teach-list li { padding-top: 8px; }
      .safety-strip { margin-top: 10px; padding: 10px 12px; font-size: 14px; }
    }
    @media print {
      body { overflow: visible; }
      .slide { position: relative; opacity: 1; pointer-events: auto; transform: none; page-break-after: always; }
      .deck-counter, .deck-hint, .deck-progress { display: none; }
    }
  </style>
</head>
<body>
  <main id="deck" aria-live="polite"></main>
  <div class="deck-progress" id="deck-progress" aria-hidden="true"></div>
  <div class="deck-counter" id="deck-counter">1 / 45</div>
  <div class="deck-hint">← / → · 滑動 · 點左右半邊</div>

    function esc(text) {
      return String(text ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }
    function notesHtml(notes) {
      return `<aside class="notes">${(notes || []).map(line => `<p>${esc(line)}</p>`).join("")}</aside>`;
    }
    function cardGrid(cards) {
      return `<div class="hero-flow">${cards.map(([h, p]) => `<div class="plain-card"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("")}</div>`;
    }
    function pointsGrid(points) {
      const klass = points.length === 4 ? "four-grid" : points.length === 2 ? "two-grid" : "three-grid";
      return `<div class="${klass}">${points.map(([h, p]) => `<div class="plain-card"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("")}</div>`;
    }
    function slideInner(s) {
      if (s.kind === "hero") {
        return `<p class="eyebrow">${esc(s.eyebrow)}</p><h1 class="h-hero">${esc(s.title)}</h1><p class="lead">${esc(s.lead)}</p>${cardGrid(s.cards || [])}`;
      }
      if (s.kind === "concept") {
        return `<p class="eyebrow">${esc(s.eyebrow)}</p><h2 class="h-xl">${esc(s.title)}</h2><p class="lead">${esc(s.lead)}</p>${pointsGrid(s.points || [])}`;
      }
      if (s.kind === "table") {
        return `<p class="eyebrow">${esc(s.eyebrow)}</p><h2 class="h-md">${esc(s.title)}</h2><div class="check-list">${s.rows.map(([h, p], i) => `<li><strong>${String(i + 1).padStart(2, "0")}</strong>${esc(h)}：${esc(p)}</li>`).join("")}</div>`;
      }
      if (s.kind === "compare") {
        return `<p class="eyebrow">${esc(s.eyebrow)}</p><h2 class="h-md">${esc(s.title)}</h2><div class="two-grid"><div class="plain-card"><h3>${esc(s.leftTitle)}</h3><ul>${s.left.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div class="plain-card"><h3>${esc(s.rightTitle)}</h3><ul>${s.right.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>`;
      }
      if (s.kind === "flow") {
        return `<p class="eyebrow">${esc(s.eyebrow)}</p><h2 class="h-md">${esc(s.title)}</h2><div class="flow-list">${s.steps.map(([n, h, p]) => `<div class="step-box"><span class="num">${esc(n)}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("")}</div>${s.footer ? `<div class="safety-strip">${esc(s.footer)}</div>` : ""}`;
      }
      if (s.kind === "action") {
        return `<div class="screen-layout"><figure class="screenshot-frame"><img src="assets/screenshots/${esc(s.img)}" alt="${esc(s.title)}截圖" /></figure><div class="teacher-panel"><p class="eyebrow">${esc(s.eyebrow)}</p><h2>${esc(s.title)}</h2><ul class="teach-list"><li><strong>老師說</strong><span>${esc(s.say)}</span></li><li><strong>學員做</strong><span>${esc(s.doText)}</span></li><li><strong>成功標準</strong><span>${esc(s.success)}</span></li><li class="warn"><strong>注意事項</strong><span>${esc(s.caution)}</span></li></ul>${s.safety ? `<div class="safety-strip">${esc(s.safety)}</div>` : ""}</div></div>`;
      }
      if (s.kind === "prompt" || s.kind === "template") {
        return `<p class="eyebrow">${esc(s.eyebrow)}</p><h2 class="h-md">${esc(s.title)}</h2><div class="template-box"><p class="lead">${s.kind === "prompt" ? "請學員直接貼上或依自己的商品資料替換。重點是把限制寫清楚。" : "請學員照模板填寫，先完成一個可交辦、可檢查的小流程。"}</p><pre class="template-code">${esc(s.code)}</pre></div>`;
      }
      if (s.kind === "check") {
        return `<p class="eyebrow">${esc(s.eyebrow)}</p><h2 class="h-md">${esc(s.title)}</h2><ul class="check-list">${s.items.map((x, i) => `<li><strong>${String(i + 1).padStart(2, "0")}</strong>${esc(x)}</li>`).join("")}</ul>${s.footer ? `<div class="safety-strip">${esc(s.footer)}</div>` : ""}`;
      }
      return "";
    }

    const deck = document.getElementById("deck");
    deck.innerHTML = slides.map((s, i) => {
      const classes = ["slide"].concat((s.theme || "light").split(" "));
      return `<section class="${classes.join(" ")}" data-screen-label="${esc(s.label)}" aria-hidden="true">${slideInner(s)}${notesHtml(s.notes)}</section>`;
    }).join("");

    (function () {
      const els = Array.from(document.querySelectorAll(".slide"));
      const counter = document.getElementById("deck-counter");
      const progress = document.getElementById("deck-progress");
      const KEY = "morpage-full-deck-pos";
      let active = 0;
      function setActive(i) {
        active = Math.max(0, Math.min(els.length - 1, i));
        els.forEach((slide, index) => {
          slide.classList.toggle("is-active", index === active);
          slide.classList.toggle("is-before", index < active);
          slide.setAttribute("aria-hidden", index === active ? "false" : "true");
        });
        counter.textContent = `${active + 1} / ${els.length}`;
        progress.style.width = `${((active + 1) / els.length) * 100}%`;
        try { localStorage.setItem(KEY, String(active)); } catch (_) {}
      }
      function onKey(e) {
        const t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
        if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); setActive(active + 1); }
        else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); setActive(active - 1); }
        else if (e.key === "Home") { e.preventDefault(); setActive(0); }
        else if (e.key === "End") { e.preventDefault(); setActive(els.length - 1); }
      }
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;
      function beginTouch(x, y) {
        touchStartX = x;
        touchStartY = y;
        touchStartTime = Date.now();
      }
      function finishTouch(x, y) {
        const dx = x - touchStartX;
        const dy = y - touchStartY;
        const elapsed = Date.now() - touchStartTime;
        if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.25) {
          setActive(active + (dx < 0 ? 1 : -1));
          return;
        }
        if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && elapsed < 420) {
          setActive(active + (x > window.innerWidth / 2 ? 1 : -1));
        }
      }
      window.addEventListener("keydown", onKey, true);
      window.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) beginTouch(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      window.addEventListener("touchend", (e) => {
        if (e.changedTouches.length === 1) finishTouch(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      }, { passive: true });
      window.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        beginTouch(e.clientX, e.clientY);
      }, true);
      window.addEventListener("pointerup", (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        finishTouch(e.clientX, e.clientY);
      }, true);
      document.body.setAttribute("tabindex", "-1");
      document.body.style.outline = "none";
      document.addEventListener("mousedown", () => { try { window.focus(); document.body.focus({ preventScroll: true }); } catch (_) {} });
      try {
        const saved = parseInt(localStorage.getItem(KEY) || "0", 10);
        setActive(Number.isFinite(saved) ? saved : 0);
      } catch (_) {
        setActive(0);
      }
    })();
  </script>
</body>
</html>
